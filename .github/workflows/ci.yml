name: CI

on:
  push:
    branches:
      - main
      - mergedPlatform
      - portfolio-ready
  pull_request:
    branches:
      - main
      - mergedPlatform
      - portfolio-ready

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_ENV: "1"
      TEST_DB_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: dummy-test-key
      GEMINI_MODEL: gemini-2.5-flash-lite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend smoke tests
        run: >
          pytest --no-cov
          tests/test_ai.py
          tests/test_ai_chat.py
          tests/test_references.py
          tests/test_user_router.py
          tests/test_users.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_FIREBASE_API_KEY: dummy-web-key
      VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: dummy-project
      VITE_FIREBASE_STORAGE_BUCKET: dummy.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: dummy-app-id
      VITE_GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com
      VITE_ENABLE_AI_CHATBOT: "true"
      VITE_ENABLE_GOOGLE_AUTH: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
